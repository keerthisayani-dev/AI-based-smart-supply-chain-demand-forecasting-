<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta http-equiv="Cache-Control" content="no-store" />
  <meta http-equiv="Pragma" content="no-cache" />
  <meta http-equiv="Expires" content="0" />
  <title>DemandIQ - Smart Supply Chain Demand Forecasting</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr/dist/flatpickr.min.css" />
  <link rel="stylesheet" href="/assets/css/dashboard_glass.css" />
</head>
<body>
  <div class="mesh-bg" aria-hidden="true"></div>

  <nav class="top-nav">
    <a class="logo-link" href="/dashboard" aria-label="DemandIQ Home">
      <img class="logo-icon" src="/assets/img/demandiq_icon.svg" alt="" aria-hidden="true" />
      <span class="logo-wordmark">Demand<span class="iq">IQ</span></span>
    </a>
    <div class="top-nav-right">
      <div class="nav-menu">
        <a href="#" id="navReports" class="nav-btn">Reports</a>
      </div>
      <div class="top-nav-actions">
        <span id="userNameBadge" class="user-badge" title="Signed-in user">User: ...</span>
        <span id="userBadge" class="user-badge" title="Signed-in role">Role: ...</span>
        <button id="adminDashBtn" class="nav-btn" type="button" style="display:none;">Admin Dashboard</button>
        <button id="pastDemandBtn" class="nav-btn" type="button">Past Demand View</button>
        <button id="downloadBtn" class="nav-btn" type="button">Download</button>
        <button id="backBtn" class="nav-btn" type="button">Back</button>
        <button id="logoutBtn" class="nav-btn" type="button">Logout</button>
      </div>
    </div>
  </nav>

  <main class="page-shell preload">
    <section class="hero">
      <h1 class="hero-title">
        <img class="title-icon" src="/assets/img/demandiq_icon.svg" alt="" aria-hidden="true" />
        <span>Demand<span class="iq">IQ</span></span>
      </h1>
      <p class="hero-sub">Smart Supply Chain Demand Forecasting</p>
      <p class="hero-desc">Configure category and date range to generate AI-powered demand projections.</p>
      <p id="roleHint" class="helper-text" style="margin-top:10px;">Loading access level...</p>
    </section>

    <section id="forecastPanel" class="glass-panel config-panel">
      <div class="field">
        <label for="category">Category</label>
        <select id="category" autocomplete="off">
          <option value="" selected disabled hidden>Select category</option>
        </select>
        <div id="categoryError" class="field-error" role="alert" aria-live="polite"></div>
      </div>

      <div class="date-grid">
        <div class="field">
          <label for="fromDate">From Date</label>
          <input id="fromDate" type="text" autocomplete="off" placeholder="Select start date" />
          <div id="fromDateError" class="field-error" role="alert" aria-live="polite"></div>
        </div>
        <div class="field">
          <label for="toDate">To Date</label>
          <input id="toDate" type="text" autocomplete="off" placeholder="Select end date" />
          <div id="toDateError" class="field-error" role="alert" aria-live="polite"></div>
        </div>
      </div>

      <p class="helper-text">Choose a date range between 2025 and 2031 for forecasting.</p>
      <button id="generateBtn" class="btn-primary cta-main" type="button">Generate Forecast</button>
    </section>
  </main>

  <footer class="page-footer">© DemandIQ - AI Demand Forecasting System</footer>

  <script src="https://cdn.jsdelivr.net/npm/flatpickr"></script>
  <script>
    const categoryEl = document.getElementById("category");
    const fromDateEl = document.getElementById("fromDate");
    const toDateEl = document.getElementById("toDate");
    const categoryErrorEl = document.getElementById("categoryError");
    const fromDateErrorEl = document.getElementById("fromDateError");
    const toDateErrorEl = document.getElementById("toDateError");
    const userNameBadgeEl = document.getElementById("userNameBadge");
    const userBadgeEl = document.getElementById("userBadge");
    const roleHintEl = document.getElementById("roleHint");
    const ALLOWED_MIN_DATE = "2025-01-01";
    const ALLOWED_MAX_DATE = "2031-12-31";
    const DASHBOARD_STATE_KEY = "dashboard_form_state_v1";
    const DASHBOARD_FORCE_CLEAR_KEY = "dashboard_force_clear_v1";
    const LOGIN_CLEAR_AFTER_LOGOUT_KEY = "demandiq_clear_login_after_logout_v1";
    let fromPicker = null;
    let toPicker = null;

    function setFieldError(inputEl, errorEl, message) {
      errorEl.textContent = String(message || "");
      errorEl.classList.add("is-visible");
      inputEl.classList.add("input-error");
    }

    function clearFieldError(inputEl, errorEl) {
      errorEl.textContent = "";
      errorEl.classList.remove("is-visible");
      inputEl.classList.remove("input-error");
    }

    function clearAllErrors() {
      clearFieldError(categoryEl, categoryErrorEl);
      clearFieldError(fromDateEl, fromDateErrorEl);
      clearFieldError(toDateEl, toDateErrorEl);
    }

    function apiBase() {
      return window.location.origin;
    }

    function setDefaultDates() {
      fromDateEl.value = "";
      toDateEl.value = "";
    }

    function formatRole(role) {
      const mapping = {
        admin: "Admin",
        inventory_manager: "Inventory Manager",
        viewer: "Viewer",
      };
      const key = String(role || "").toLowerCase();
      return mapping[key] || "Unknown";
    }

    async function applyRoleUi() {
      try {
        const resp = await fetch(`${apiBase()}/auth/me`);
        if (!resp.ok) {
          window.location.href = "/login";
          return;
        }
        const data = await resp.json();
        const role = String(data?.user?.role || "");
        const fullName = String(data?.user?.full_name || "User");
        const roleTitle = formatRole(role);
        userNameBadgeEl.textContent = `User: ${fullName}`;
        userBadgeEl.textContent = `Role: ${roleTitle}`;
        const adminDashBtn = document.getElementById("adminDashBtn");
        if (adminDashBtn) {
          adminDashBtn.style.display = role === "admin" ? "" : "none";
        }
        if (role === "admin") roleHintEl.textContent = "Admin access: full system operations enabled.";
        if (role === "inventory_manager") roleHintEl.textContent = "Inventory Manager access: operational inventory insights enabled.";
        if (role === "viewer") roleHintEl.textContent = "Viewer access: read-only dashboard and forecasts. Export and inventory insights are restricted.";
        const downloadBtn = document.getElementById("downloadBtn");
        if (downloadBtn) {
          const restrictDownload = role === "viewer";
          downloadBtn.disabled = restrictDownload;
          downloadBtn.style.opacity = restrictDownload ? "0.65" : "1";
          downloadBtn.title = restrictDownload ? "Download restricted for Viewer role" : "";
        }
      } catch (_) {
        window.location.href = "/login";
      }
    }

    function initDatePickers() {
      if (fromPicker) fromPicker.destroy();
      if (toPicker) toPicker.destroy();

      fromPicker = flatpickr(fromDateEl, {
        dateFormat: "Y-m-d",
        allowInput: false,
        monthSelectorType: "static",
        minDate: ALLOWED_MIN_DATE,
        maxDate: ALLOWED_MAX_DATE,
      });
      toPicker = flatpickr(toDateEl, {
        dateFormat: "Y-m-d",
        allowInput: false,
        monthSelectorType: "static",
        minDate: ALLOWED_MIN_DATE,
        maxDate: ALLOWED_MAX_DATE,
      });
    }

    async function loadCategories(preferredCategory = "") {
      try {
        const resp = await fetch(`${apiBase()}/categories`);
        if (!resp.ok) throw new Error(`HTTP ${resp.status}`);
        const data = await resp.json();

        const categories = Array.isArray(data.categories) ? data.categories : [];
        const dropdownValues = [...new Set(categories.map(v => String(v).trim()).filter(Boolean))].sort();

        categoryEl.innerHTML = '<option value="" selected disabled hidden>Select category</option>';
        dropdownValues.forEach((cat) => {
          const opt = document.createElement("option");
          opt.value = cat;
          opt.textContent = cat;
          categoryEl.appendChild(opt);
        });

        if (preferredCategory && dropdownValues.includes(preferredCategory)) {
          categoryEl.value = preferredCategory;
        }
      } catch (err) {
        console.error(`Failed to load categories: ${err.message}`);
        setFieldError(categoryEl, categoryErrorEl, "Unable to load categories. Please refresh and try again.");
      }
    }

    function clearInputState() {
      categoryEl.innerHTML = "";
      fromDateEl.value = "";
      toDateEl.value = "";
    }

    function saveDashboardState() {
      const state = {
        category: categoryEl.value || "",
        fromDate: fromDateEl.value || "",
        toDate: toDateEl.value || "",
      };
      sessionStorage.setItem(DASHBOARD_STATE_KEY, JSON.stringify(state));
    }

    function clearDashboardState() {
      sessionStorage.removeItem(DASHBOARD_STATE_KEY);
    }

    function readDashboardState() {
      try {
        const raw = sessionStorage.getItem(DASHBOARD_STATE_KEY);
        if (!raw) return null;
        const parsed = JSON.parse(raw);
        return {
          category: String(parsed?.category || ""),
          fromDate: String(parsed?.fromDate || ""),
          toDate: String(parsed?.toDate || ""),
        };
      } catch (_) {
        return null;
      }
    }

    function getNavigationType() {
      const navEntry = performance.getEntriesByType("navigation")[0];
      return navEntry ? navEntry.type : "";
    }

    function consumeForceClearFlag() {
      const shouldClear = sessionStorage.getItem(DASHBOARD_FORCE_CLEAR_KEY) === "1";
      if (shouldClear) {
        sessionStorage.removeItem(DASHBOARD_FORCE_CLEAR_KEY);
      }
      return shouldClear;
    }

    async function initializeDefaults() {
      clearAllErrors();
      await applyRoleUi();
      const shouldClearFromReload = getNavigationType() === "reload";
      const shouldClearFromLogout = consumeForceClearFlag();
      const shouldClear = shouldClearFromReload || shouldClearFromLogout;
      const savedState = shouldClear ? null : readDashboardState();

      if (shouldClear) {
        clearDashboardState();
      }

      clearInputState();
      initDatePickers();
      setDefaultDates();
      await loadCategories(savedState?.category || "");

      if (savedState?.fromDate) {
        fromPicker.setDate(savedState.fromDate, true, "Y-m-d");
      }
      if (savedState?.toDate) {
        toPicker.setDate(savedState.toDate, true, "Y-m-d");
      }
      const shell = document.querySelector(".page-shell");
      if (shell) {
        shell.classList.remove("preload");
        shell.classList.add("ready");
      }
    }

    function validateInputs() {
      clearAllErrors();
      const category = categoryEl.value;
      const fromDate = fromDateEl.value;
      const toDate = toDateEl.value;

      let hasError = false;
      if (!category) {
        setFieldError(categoryEl, categoryErrorEl, "Please select a category.");
        hasError = true;
      }
      if (!fromDate) {
        setFieldError(fromDateEl, fromDateErrorEl, "Please select a start date.");
        hasError = true;
      }
      if (!toDate) {
        setFieldError(toDateEl, toDateErrorEl, "Please select an end date.");
        hasError = true;
      }
      if (hasError) {
        return false;
      }

      const from = new Date(fromDate);
      const to = new Date(toDate);
      if (from > to) {
        setFieldError(toDateEl, toDateErrorEl, "To Date must be on or after From Date.");
        return false;
      }

      const minAllowed = new Date(ALLOWED_MIN_DATE);
      const maxAllowed = new Date(ALLOWED_MAX_DATE);
      if (from < minAllowed || from > maxAllowed) {
        setFieldError(fromDateEl, fromDateErrorEl, "Use a date between 2025 and 2031.");
        hasError = true;
      }
      if (to < minAllowed || to > maxAllowed) {
        setFieldError(toDateEl, toDateErrorEl, "Use a date between 2025 and 2031.");
        hasError = true;
      }
      return !hasError;
    }

    function goToResults(mode = "forecast") {
      clearAllErrors();
      const category = categoryEl.value;
      const fromDate = fromDateEl.value;
      const toDate = toDateEl.value;

      if (!validateInputs()) {
        return;
      }

      saveDashboardState();
      const resultUrl = `/dashboard/results?category=${encodeURIComponent(category)}&from=${encodeURIComponent(fromDate)}&to=${encodeURIComponent(toDate)}&mode=${encodeURIComponent(mode)}`;
      window.location.href = resultUrl;
    }

    initializeDefaults();
    window.addEventListener("pageshow", initializeDefaults);
    categoryEl.addEventListener("change", () => clearFieldError(categoryEl, categoryErrorEl));
    fromDateEl.addEventListener("input", () => clearFieldError(fromDateEl, fromDateErrorEl));
    toDateEl.addEventListener("input", () => clearFieldError(toDateEl, toDateErrorEl));
    document.getElementById("generateBtn").addEventListener("click", () => goToResults("forecast"));
    document.getElementById("pastDemandBtn").addEventListener("click", () => goToResults("past"));
    document.getElementById("downloadBtn").addEventListener("click", () => goToResults("forecast"));
    document.getElementById("adminDashBtn").addEventListener("click", () => {
      window.location.href = "/admin/dashboard";
    });
    async function logoutAndGoLogin() {
      try {
        await fetch("/auth/logout", { method: "POST" });
      } catch (_) {
        // Continue to login even if logout API fails.
      }
      sessionStorage.removeItem(DASHBOARD_STATE_KEY);
      sessionStorage.setItem(DASHBOARD_FORCE_CLEAR_KEY, "1");
      sessionStorage.setItem(LOGIN_CLEAR_AFTER_LOGOUT_KEY, "1");
      window.location.href = "/login?logged_out=1";
    }

    document.getElementById("backBtn").addEventListener("click", () => {
      logoutAndGoLogin();
    });
    document.getElementById("logoutBtn").addEventListener("click", () => {
      logoutAndGoLogin();
    });
    document.getElementById("navReports").addEventListener("click", (e) => {
      e.preventDefault();
      const panel = document.getElementById("forecastPanel");
      if (panel) {
        panel.scrollIntoView({ behavior: "smooth", block: "start" });
      }
    });
  </script>
</body>
</html>
