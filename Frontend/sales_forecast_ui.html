<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Sales Forecast Console</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg1: #f8f6f0;
      --bg2: #eef6f4;
      --card: #ffffff;
      --ink: #14324d;
      --muted: #5c7388;
      --accent: #0f7f6a;
      --accent-2: #f0873c;
      --line: #cfdae5;
      --ok: #1f7a45;
      --err: #b42318;
      --placeholder: #8297ab;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: "Space Grotesk", sans-serif;
      color: var(--ink);
      background: radial-gradient(circle at 20% 10%, #fff7df, transparent 36%),
                  radial-gradient(circle at 80% 0%, #d9f0ec, transparent 32%),
                  linear-gradient(135deg, var(--bg1), var(--bg2));
      min-height: 100vh;
      padding: 0;
    }

    .panel {
      width: 100%;
      min-height: 100vh;
      background: color-mix(in srgb, var(--card) 94%, #f2f7fa);
      border: 1px solid var(--line);
      border-radius: 0;
      box-shadow: 0 20px 38px rgba(19, 49, 71, 0.12);
      overflow: hidden;
      animation: fadeIn 420ms ease;
    }

    .header {
      padding: 30px 32px 20px;
      background: linear-gradient(90deg, rgba(15,127,106,0.10), rgba(240,135,60,0.08));
      border-bottom: 1px solid var(--line);
    }

    h1 {
      margin: 0;
      font-size: clamp(2rem, 3.8vw, 3rem);
      letter-spacing: .2px;
      line-height: 1.1;
    }

    .sub {
      margin: 12px 0 0;
      color: #3e5f79;
      font-size: 1.4rem;
      font-weight: 600;
    }

    .content {
      display: grid;
      grid-template-columns: 320px 1fr;
      gap: 20px;
      padding: 24px 26px 28px;
    }

    .card {
      border: 1px solid var(--line);
      border-radius: 16px;
      padding: 18px;
      background: linear-gradient(180deg, #fbfdff 0%, #f7fbff 100%);
    }

    .field { margin-bottom: 12px; }
    label {
      display: block;
      font-family: "Space Grotesk", sans-serif;
      font-size: 1.28rem;
      color: #163a56;
      margin-bottom: 8px;
      font-weight: 800;
      letter-spacing: 0.15px;
    }

    input, select {
      width: 100%;
      border: 1px solid #afc1d2;
      border-radius: 12px;
      padding: 15px 16px;
      font-size: 1.35rem;
      font-family: inherit;
      line-height: 1.25;
      background: #fbfdff;
      color: #102a43;
      transition: border-color .16s ease, box-shadow .16s ease, color .16s ease;
    }

    select.placeholder {
      color: var(--placeholder);
    }

    select:focus, input:focus {
      outline: none;
      border-color: #6f97ba;
      box-shadow: 0 0 0 3px rgba(33, 118, 199, 0.14);
    }

    option {
      color: #102a43;
    }

    .field-error {
      min-height: 16px;
      margin-top: 4px;
      font-size: .9rem;
      color: var(--err);
      font-weight: 500;
    }

    .field-hint {
      min-height: 16px;
      margin-top: 4px;
      font-size: .88rem;
      color: #7c3300;
      padding: 2px 0;
      visibility: hidden;
      opacity: 0;
      transition: opacity .12s ease;
    }

    .field-hint.show {
      visibility: visible;
      opacity: 1;
    }

    .input-invalid {
      border-color: #cc5467 !important;
      box-shadow: 0 0 0 3px rgba(161, 29, 51, 0.12) !important;
    }

    .output {
      height: 100%;
      display: grid;
      gap: 12px;
      grid-template-rows: auto auto 1fr;
    }

    .hint {
      font-size: 1.32rem;
      color: #3e5f79;
      font-weight: 600;
    }

    .form-notice {
      margin-top: 2px;
      margin-bottom: 0;
      font-size: .96rem;
      color: #9f1239;
      font-weight: 500;
      background: rgba(159, 18, 57, 0.06);
      border: 1px solid rgba(159, 18, 57, 0.18);
      border-radius: 10px;
      padding: 9px 12px;
    }

    .form-notice:empty {
      display: none;
    }

    .quarter-grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 16px;
    }

    .quarter-card {
      border: 1px solid #a7bfd4;
      border-radius: 16px;
      background: linear-gradient(180deg, #f7fbff 0%, #edf5fd 100%);
      box-shadow: 0 8px 20px rgba(20, 50, 77, 0.07);
      padding: 10px 10px 10px;
    }

    .quarter-head {
      display: block;
      margin-bottom: 6px;
    }

    .quarter-main {
      font-weight: 800;
      font-size: 1.5rem;
      margin-bottom: 2px;
      color: #163a56;
    }

    .quarter-controls {
      display: grid;
      grid-template-columns: minmax(180px, 320px) auto;
      gap: 10px;
      align-items: center;
    }

    .quarter-action {
      display: inline-flex;
      align-items: center;
      width: fit-content;
      border: 1px solid #0f7f6a;
      border-radius: 10px;
      background: linear-gradient(90deg, #0f7f6a, #148f76);
      color: #fff;
      padding: 9px 14px;
      font: inherit;
      font-size: 1rem;
      font-weight: 700;
      letter-spacing: .2px;
      cursor: pointer;
      box-shadow: 0 6px 12px rgba(15, 127, 106, 0.18);
    }

    .quarter-action:hover {
      filter: brightness(1.03);
      transform: translateY(-1px);
    }

    .quarter-action:disabled {
      cursor: not-allowed;
      opacity: 0.55;
      border-color: #9db4c8;
      background: linear-gradient(90deg, #9fb2c2, #a9bccb);
      box-shadow: none;
      transform: none;
      filter: none;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      background: #fff;
      font-size: .9rem;
    }

    th, td {
      padding: 9px 10px;
      border-bottom: 1px solid #ebf0f4;
      text-align: left;
    }

    th {
      position: sticky;
      top: 0;
      background: #f2f8fb;
      color: #20435f;
      font-weight: 600;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @media (max-width: 800px) {
      .header {
        padding: 20px 18px 14px;
      }
      h1 {
        font-size: clamp(1.45rem, 6vw, 2rem);
      }
      .sub {
        font-size: 1rem;
      }
      .content { grid-template-columns: 1fr; }
      .content {
        padding: 16px 14px 20px;
      }
      .quarter-main {
        font-size: 1.2rem;
      }
      .quarter-controls {
        grid-template-columns: 1fr;
        gap: 8px;
      }
    }
  </style>
</head>
<body>
  <section class="panel">
    <div class="header">
      <h1>Supply Chain Forecast Console</h1>
      <p class="sub">Submit sales input and view forecast details.</p>
    </div>

    <div class="content">
      <form id="salesForm" class="card">
        <div class="field">
          <label for="date">Date</label>
          <input id="date" name="date" type="date" required>
          <div id="dateError" class="field-error"></div>
        </div>
        <div class="field">
          <label for="units">Units Sold</label>
          <input id="units" name="units" type="number" min="0" step="1" required>
          <div id="unitsError" class="field-error"></div>
        </div>
      </form>

      <div class="card output">
        <div class="field">
          <label for="category">Category</label>
          <select id="category" name="category" required>
            <option value="" selected disabled hidden>Select category</option>
            <option value="Clothing">Clothing</option>
            <option value="Toys">Toys</option>
            <option value="Electronics">Electronics</option>
            <option value="Groceries">Groceries</option>
            <option value="Furniture">Furniture</option>
          </select>
          <div id="categoryError" class="field-error"></div>
        </div>
        <div class="hint">Select quarter and month, then open forecast details.</div>
        <div id="formNotice" class="form-notice"></div>
        <div id="quarterGrid" class="quarter-grid"></div>
      </div>
    </div>
  </section>

  <script>
    const form = document.getElementById("salesForm");
    const quarterGrid = document.getElementById("quarterGrid");
    const categoryEl = document.getElementById("category");
    const dateEl = document.getElementById("date");
    const unitsEl = document.getElementById("units");
    const dateErrorEl = document.getElementById("dateError");
    const unitsErrorEl = document.getElementById("unitsError");
    const categoryErrorEl = document.getElementById("categoryError");
    const formNoticeEl = document.getElementById("formNotice");
    const pageParams = new URLSearchParams(location.search);
    const isFileProtocol = location.protocol === "file:";
    const apiBase = isFileProtocol ? "http://127.0.0.1:8000" : "";
    const apiUrl = (path) => `${apiBase}${path}`;
    const resultsUrl = (params) => {
      if (isFileProtocol) {
        return `forecast_results.html?${params.toString()}`;
      }
      return `/results?${params.toString()}`;
    };
    const quarterItems = [
      { quarter: "Q1", label: "Quarter-1", months: ["January", "February", "March"] },
      { quarter: "Q2", label: "Quarter-2", months: ["April", "May", "June"] },
      { quarter: "Q3", label: "Quarter-3", months: ["July", "August", "September"] },
      { quarter: "Q4", label: "Quarter-4", months: ["October", "November", "December"] },
    ];
    const quarterMonthMap = {
      Q1: [0, 1, 2],
      Q2: [3, 4, 5],
      Q3: [6, 7, 8],
      Q4: [9, 10, 11],
    };
    const FORECAST_CACHE_KEY = "dashboard_forecast_cache_v1";
    const QUARTER_HORIZON_DAYS = 365;
    let quarterStats = {};
    const selectedMonthByQuarter = {};
    const navEntry = performance.getEntriesByType && performance.getEntriesByType("navigation")[0];
    const isReload = (navEntry && navEntry.type === "reload")
      || (performance.navigation && performance.navigation.type === 1);

    function setFieldError(inputEl, errorEl, message) {
      if (!inputEl || !errorEl) return;
      errorEl.textContent = message || "";
      inputEl.classList.toggle("input-invalid", Boolean(message));
    }

    function setFormNotice(message) {
      if (!formNoticeEl) return;
      formNoticeEl.textContent = message || "";
    }

    function clearAllFormErrors() {
      setFieldError(dateEl, dateErrorEl, "");
      setFieldError(unitsEl, unitsErrorEl, "");
      setFieldError(categoryEl, categoryErrorEl, "");
      setFormNotice("");
    }

    function setMonthError(quarter, message) {
      const monthSelect = document.getElementById(`month-start-${quarter}`);
      const errorEl = document.getElementById(`month-error-${quarter}`);
      if (!monthSelect || !errorEl) return;
      errorEl.textContent = message || "";
      monthSelect.classList.toggle("input-invalid", Boolean(message));
    }

    function setMonthHint(quarter, message) {
      const hintEl = document.getElementById(`month-hint-${quarter}`);
      if (!hintEl) return;
      hintEl.textContent = message || "";
      hintEl.classList.toggle("show", Boolean(message));
    }

    function applySelectPlaceholderState(selectEl) {
      if (!selectEl) return;
      selectEl.classList.toggle("placeholder", !selectEl.value);
    }

    function validateInputs() {
      const dateValue = dateEl.value.trim();
      const categoryValue = categoryEl.value.trim();
      const unitsRaw = unitsEl.value.trim();
      clearAllFormErrors();
      let firstInvalidEl = null;

      if (!dateValue) {
        setFieldError(dateEl, dateErrorEl, "Date is required.");
        if (!firstInvalidEl) firstInvalidEl = dateEl;
      }

      if (!unitsRaw) {
        setFieldError(unitsEl, unitsErrorEl, "Units Sold is required.");
        if (!firstInvalidEl) firstInvalidEl = unitsEl;
      }

      const unitsNum = Number(unitsRaw);
      if (unitsRaw && (!Number.isFinite(unitsNum) || unitsNum < 0)) {
        setFieldError(unitsEl, unitsErrorEl, "Units Sold must be a valid non-negative number.");
        if (!firstInvalidEl) firstInvalidEl = unitsEl;
      }

      if (!categoryValue) {
        setFieldError(categoryEl, categoryErrorEl, "Category is required.");
        if (!firstInvalidEl) firstInvalidEl = categoryEl;
      }

      if (firstInvalidEl) {
        setFormNotice("Please fill in the details.");
        firstInvalidEl.focus();
        return null;
      }

      return {
        date: dateValue,
        category: categoryValue,
        units: unitsNum,
      };
    }

    function buildParams(extra = {}) {
      const valid = validateInputs();
      if (!valid) return null;
      return new URLSearchParams({
        date: valid.date,
        category: valid.category,
        units_sold: String(valid.units),
        horizon: "90",
        quarter: "",
        month: "",
        ...extra,
      });
    }

    function toIso(d) {
      return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`;
    }

    function hydrateDashboardStateFromQuery() {
      if (isReload) return;
      const qDate = (pageParams.get("date") || "").trim();
      const qCategory = (pageParams.get("category") || "").trim();
      const qUnits = (pageParams.get("units_sold") || "").trim();
      const qQuarter = (pageParams.get("quarter") || "").trim().toUpperCase();
      const qMonth = (pageParams.get("month") || "").trim();

      if (qDate) dateEl.value = qDate;
      if (qUnits) unitsEl.value = qUnits;
      if (qCategory && Array.from(categoryEl.options).some((opt) => opt.value === qCategory)) {
        categoryEl.value = qCategory;
      }

      if (qQuarter && quarterItems.some((item) => item.quarter === qQuarter)) {
        selectedMonthByQuarter[qQuarter] = qMonth || "";
      }
    }

    async function hydrateCategories() {
      try {
        const res = await fetch(apiUrl("/categories"));
        const data = await res.json();
        if (!res.ok || !Array.isArray(data.categories)) return;
        const categories = data.categories
          .map((item) => String(item).trim())
          .filter(Boolean);
        if (!categories.length) return;
        const selected = (categoryEl.value || "").trim();
        categoryEl.innerHTML = `
          <option value="" selected disabled hidden>Select category</option>
          ${categories.map((c) => `<option value="${c}">${c}</option>`).join("")}
        `;
        if (selected && categories.includes(selected)) {
          categoryEl.value = selected;
        }
      } catch (_) {
        // Keep static fallback options if categories API is unavailable.
      }
      applySelectPlaceholderState(categoryEl);
    }

    function deriveAnchorDate() {
      const raw = dateEl.value.trim();
      const parsed = new Date(`${raw}T00:00:00`);
      if (!raw || Number.isNaN(parsed.getTime())) return "";
      return toIso(new Date(parsed.getTime() - 86400000));
    }

    function deriveAnchorFromIsoDate(isoDate) {
      const parsed = new Date(`${isoDate}T00:00:00`);
      if (Number.isNaN(parsed.getTime())) return "";
      return toIso(new Date(parsed.getTime() - 86400000));
    }

    function alignDateToMonth(baseIsoDate, monthName) {
      const monthLookup = {
        January: 0, February: 1, March: 2, April: 3, May: 4, June: 5,
        July: 6, August: 7, September: 8, October: 9, November: 10, December: 11,
      };
      const targetMonth = monthLookup[monthName];
      if (!Number.isInteger(targetMonth)) return baseIsoDate;
      const base = new Date(`${baseIsoDate}T00:00:00`);
      const baseYear = Number.isNaN(base.getTime()) ? new Date().getFullYear() : base.getFullYear();
      const baseDay = Number.isNaN(base.getTime()) ? 1 : base.getDate();
      const day = Math.max(1, Math.min(baseDay, 28));
      return toIso(new Date(baseYear, targetMonth, day));
    }

    function openQuarterDetails(quarter) {
      const monthStartEl = document.getElementById(`month-start-${quarter}`);
      const monthStart = monthStartEl ? monthStartEl.value : "";
      const valid = validateInputs();
      if (!valid) return;
      setMonthError(quarter, "");
      if (!monthStart) {
        setMonthError(quarter, "Please select a month.");
        if (monthStartEl) monthStartEl.focus();
        return;
      }

      const alignedDate = alignDateToMonth(valid.date, monthStart);
      const params = new URLSearchParams({
        date: alignedDate,
        category: valid.category,
        units_sold: String(valid.units),
        horizon: String(QUARTER_HORIZON_DAYS),
        view_scope: "quarter",
        quarter: quarter,
        month: monthStart,
        month_start: monthStart,
        month_end: monthStart,
        anchor_date: deriveAnchorFromIsoDate(alignedDate),
      });
      window.location.href = resultsUrl(params);
    }

    function parseRows(rows) {
      return rows
        .map((r) => ({
          date: new Date(`${r.date}T00:00:00`),
          value: Number(r.forecast_units_sold),
        }))
        .filter((r) => Number.isFinite(r.value) && !Number.isNaN(r.date.getTime()))
        .sort((a, b) => a.date - b.date);
    }

    function svgSparkline(values, color) {
      const w = 640;
      const h = 132;
      if (values.length < 2) {
        return `
          <svg class="spark" viewBox="0 0 ${w} ${h}" preserveAspectRatio="none" aria-hidden="true" shape-rendering="geometricPrecision">
            <rect x="0" y="0" width="${w}" height="${h}" fill="rgba(16,42,67,0.03)" />
            <line x1="0" y1="${h * 0.5}" x2="${w}" y2="${h * 0.5}" stroke="rgba(112,121,131,0.45)" stroke-width="1" stroke-dasharray="4 7"/>
            <line x1="${w / 2}" y1="10" x2="${w / 2}" y2="${h - 14}" stroke="rgba(112,121,131,0.24)" stroke-width="1"/>
          </svg>
        `;
      }
      const data = values.length < 4
        ? values
        : values.map((v, i, arr) => {
            const prev = i > 0 ? arr[i - 1] : v;
            const next = i < arr.length - 1 ? arr[i + 1] : v;
            // Smooth noisy quarter traces for a stable dashboard look.
            return (prev * 0.25) + (v * 0.5) + (next * 0.25);
          });
      const min = Math.min(...data);
      const max = Math.max(...data);
      const span = Math.max(1, max - min);
      const topPad = 10;
      const bottomPad = 14;
      const drawH = h - topPad - bottomPad;
      const points = data.map((v, i) => ({
        x: (i / (data.length - 1)) * w,
        y: ((max - v) / span) * drawH + topPad,
      }));
      const first = points[0];
      const last = points[points.length - 1];
      const accent = color || "#c7222a";
      const fillColor = (accent === "#c02d3f" || accent === "#c7222a")
        ? "rgba(199,34,42,0.16)"
        : "rgba(27,143,64,0.14)";

      const linePath = points.map((pt, i) => {
        if (i === 0) return `M ${pt.x.toFixed(1)} ${pt.y.toFixed(1)}`;
        const prev = points[i - 1];
        const cx = ((prev.x + pt.x) / 2).toFixed(1);
        return `Q ${prev.x.toFixed(1)} ${prev.y.toFixed(1)} ${cx} ${((prev.y + pt.y) / 2).toFixed(1)} T ${pt.x.toFixed(1)} ${pt.y.toFixed(1)}`;
      }).join(" ");

      const areaPath = `${linePath} L ${last.x.toFixed(1)} ${(h - bottomPad).toFixed(1)} L ${first.x.toFixed(1)} ${(h - bottomPad).toFixed(1)} Z`;
      return `
        <svg class="spark" viewBox="0 0 ${w} ${h}" preserveAspectRatio="none" aria-hidden="true" shape-rendering="geometricPrecision">
          <rect x="0" y="0" width="${w}" height="${h}" fill="rgba(246,250,254,0.92)" />
          <line x1="0" y1="${topPad + (drawH / 2)}" x2="${w}" y2="${topPad + (drawH / 2)}" stroke="rgba(112,121,131,0.35)" stroke-width="1" stroke-dasharray="4 7"/>
          <line x1="${w / 2}" y1="${topPad}" x2="${w / 2}" y2="${h - bottomPad}" stroke="rgba(112,121,131,0.18)" stroke-width="1"/>
          <path d="${areaPath}" fill="${fillColor}" />
          <path d="${linePath}" fill="none" stroke="${accent}" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />
          <circle cx="${last.x.toFixed(1)}" cy="${last.y.toFixed(1)}" r="4.8" fill="${accent}" />
        </svg>
      `;
    }

    function buildQuarterStats(forecastRows) {
      const parsed = parseRows(forecastRows);
      const out = {};
      Object.entries(quarterMonthMap).forEach(([q, months]) => {
        const values = parsed
          .filter((r) => months.includes(r.date.getMonth()))
          .map((r) => r.value);
        const positive = values.length < 2 ? true : values[values.length - 1] >= values[0];
        out[q] = { values, positive };
      });
      return out;
    }

    function buildStableFallbackStats() {
      const out = {};
      const template = Array.from({ length: 24 }, (_, i) => {
        const t = i / 23;
        return 100 + (Math.sin(t * Math.PI * 2) * 10) + (t * 6);
      });
      quarterItems.forEach((item) => {
        out[item.quarter] = { values: [...template], positive: true };
      });
      return out;
    }

    function readForecastCache() {
      try {
        const raw = localStorage.getItem(FORECAST_CACHE_KEY);
        if (!raw) return {};
        const parsed = JSON.parse(raw);
        return parsed && typeof parsed === "object" ? parsed : {};
      } catch (_) {
        return {};
      }
    }

    function writeForecastCache(cacheObj) {
      try {
        localStorage.setItem(FORECAST_CACHE_KEY, JSON.stringify(cacheObj));
      } catch (_) {
        // Ignore cache write failures (private mode/quota).
      }
    }

    function renderQuarterCards() {
      quarterGrid.innerHTML = quarterItems
        .map((item) => `
          <div class="quarter-card">
            <div class="quarter-head">
              <div class="quarter-main">${item.label}</div>
            </div>
            <div class="quarter-controls">
              <select id="month-start-${item.quarter}">
                <option value="" selected disabled hidden>Select range</option>
                ${item.months.map((m) => `<option value="${m}">${m}</option>`).join("")}
              </select>
              <button type="button" id="view-btn-${item.quarter}" class="quarter-action" disabled>View Forecast</button>
            </div>
            <div id="month-hint-${item.quarter}" class="field-hint"></div>
            <div id="month-error-${item.quarter}" class="field-error"></div>
          </div>
        `)
        .join("");

      quarterItems.forEach((item) => {
        const monthSelect = document.getElementById(`month-start-${item.quarter}`);
        const viewBtn = document.getElementById(`view-btn-${item.quarter}`);
        applySelectPlaceholderState(monthSelect);
        if (viewBtn) {
          viewBtn.addEventListener("click", () => openQuarterDetails(item.quarter));
        }
        if (monthSelect) {
          const selected = selectedMonthByQuarter[item.quarter];
          if (selected && item.months.includes(selected)) {
            monthSelect.value = selected;
            applySelectPlaceholderState(monthSelect);
            if (viewBtn) viewBtn.disabled = false;
          }
          monthSelect.addEventListener("change", () => {
            selectedMonthByQuarter[item.quarter] = monthSelect.value || "";
            applySelectPlaceholderState(monthSelect);
            setMonthError(item.quarter, "");
            setMonthHint(item.quarter, "");
            if (viewBtn) viewBtn.disabled = !monthSelect.value;
          });
        }
      });
    }

    function loadQuarterProjections() {
      // Keep dashboard graphs static regardless of form selections.
      quarterStats = buildStableFallbackStats();
      renderQuarterCards();
    }

    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      const params = buildParams();
      if (!params) return;
      window.location.href = resultsUrl(params);
    });

    async function initDashboard() {
      const today = new Date().toISOString().slice(0, 10);
      if (isReload) {
        dateEl.value = "";
        unitsEl.value = "";
        categoryEl.value = "";
        if (location.search) {
          history.replaceState({}, "", location.pathname);
        }
      } else {
        dateEl.value = today;
      }

      await hydrateCategories();
      if (!isReload) {
        hydrateDashboardStateFromQuery();
      }

      renderQuarterCards();
      applySelectPlaceholderState(categoryEl);
      categoryEl.addEventListener("change", () => applySelectPlaceholderState(categoryEl));
      loadQuarterProjections();
    }

    initDashboard();
  </script>
</body>
</html>
