<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta http-equiv="Cache-Control" content="no-store" />
  <meta http-equiv="Pragma" content="no-cache" />
  <meta http-equiv="Expires" content="0" />
  <title>Login - DemandIQ</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@500;600;700;800&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg-1: #0b1220;
      --bg-2: #0f172a;
      --bg-3: #111827;
      --primary: #3b82f6;
      --secondary: #06b6d4;
      --highlight: #8b5cf6;
      --gold: #e7bc79;
      --text: #e5e7eb;
      --muted: #94a3b8;
      --glass: rgba(22, 36, 62, 0.58);
      --glass-border: rgba(160, 198, 255, 0.26);
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: "Inter", "Segoe UI", Tahoma, sans-serif;
      color: var(--text);
      background:
        linear-gradient(135deg, rgba(5, 10, 24, 0.82) 0%, rgba(7, 17, 40, 0.78) 48%, rgba(10, 22, 48, 0.86) 100%),
        radial-gradient(920px 460px at 79% 22%, rgba(246, 186, 94, 0.21), transparent 62%),
        radial-gradient(980px 540px at 18% 84%, rgba(0, 183, 255, 0.2), transparent 66%),
        linear-gradient(145deg, var(--bg-1) 0%, var(--bg-2) 55%, var(--bg-3) 100%);
      padding: 20px;
      display: grid;
      place-items: center;
      position: relative;
      overflow: hidden;
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 0;
      background:
        radial-gradient(circle at 50% 52%, rgba(79, 166, 255, 0.24), transparent 42%),
        radial-gradient(circle at 50% 52%, rgba(231, 188, 121, 0.1), transparent 58%);
    }

    body::after {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 0;
      background: radial-gradient(circle at center, transparent 38%, rgba(2, 10, 28, 0.55) 100%);
    }

    .scene {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 1;
      overflow: hidden;
    }

    @keyframes gridDrift {
      0% { background-position: 0 0, 0 0; }
      100% { background-position: 180px 0, 0 140px; }
    }

    @keyframes tickerMove {
      0% { transform: translateX(0); }
      100% { transform: translateX(-50%); }
    }

    @keyframes chartDraw {
      0% { stroke-dashoffset: 1200; }
      100% { stroke-dashoffset: 0; }
    }

    @keyframes pulseDot {
      0%, 100% { transform: translate(0, 0) scale(1); opacity: 0.95; }
      50% { transform: translate(-6px, -2px) scale(1.2); opacity: 1; }
    }

    @keyframes barGrow {
      0%, 100% { transform: scaleY(0.45); }
      50% { transform: scaleY(1); }
    }

    .scene-grid-sweep {
      position: absolute;
      inset: 0;
      background:
        repeating-linear-gradient(
          to right,
          rgba(96, 170, 236, 0.06) 0 1px,
          transparent 1px 38px
        ),
        repeating-linear-gradient(
          to bottom,
          rgba(96, 170, 236, 0.05) 0 1px,
          transparent 1px 34px
        );
      animation: gridDrift 30s linear infinite;
      opacity: 0.26;
    }

    .realtime-chart {
      position: absolute;
      left: 50%;
      top: 54%;
      width: min(1200px, 96vw);
      height: 330px;
      transform: translate(-50%, -50%);
      opacity: 0.48;
      filter: drop-shadow(0 0 18px rgba(86, 186, 255, 0.26));
    }

    .realtime-chart svg {
      width: 100%;
      height: 100%;
      display: block;
    }

    .chart-path {
      fill: none;
      stroke: rgba(120, 220, 255, 0.88);
      stroke-width: 2;
      stroke-linecap: round;
      stroke-linejoin: round;
      stroke-dasharray: 1200;
      stroke-dashoffset: 1200;
      animation: chartDraw 10s ease-in-out infinite alternate;
    }

    .chart-area {
      fill: url(#marketAreaFill);
    }

    .chart-dot {
      fill: var(--gold);
      filter: drop-shadow(0 0 8px rgba(255, 193, 111, 0.85));
      transform-origin: center;
      animation: pulseDot 2.2s ease-in-out infinite;
    }

    .center-bars {
      position: absolute;
      left: 50%;
      bottom: 7%;
      width: min(980px, 84vw);
      height: 120px;
      transform: translateX(-50%);
      display: flex;
      align-items: flex-end;
      justify-content: center;
      gap: 8px;
      opacity: 0.22;
    }

    .center-bars span {
      width: 10px;
      height: 100%;
      border-radius: 3px 3px 0 0;
      background: linear-gradient(180deg, rgba(116, 209, 255, 0.95) 0%, rgba(64, 151, 236, 0.42) 100%);
      transform-origin: bottom;
      animation: barGrow 2.8s ease-in-out infinite;
    }

    .center-bars span:nth-child(2n) {
      background: linear-gradient(180deg, rgba(255, 202, 125, 0.9) 0%, rgba(255, 161, 90, 0.38) 100%);
    }

    .center-bars span:nth-child(3n) { animation-delay: 0.2s; }
    .center-bars span:nth-child(4n) { animation-delay: 0.45s; }
    .center-bars span:nth-child(5n) { animation-delay: 0.7s; }
    .center-bars span:nth-child(6n) { animation-delay: 0.95s; }

    .shelf {
      position: absolute;
      top: 0;
      bottom: 0;
      width: 24%;
      background:
        repeating-linear-gradient(
          to bottom,
          rgba(255, 198, 117, 0.12) 0 2px,
          transparent 2px 42px
        ),
        linear-gradient(180deg, rgba(33, 67, 110, 0.5), rgba(17, 30, 53, 0.55));
      filter: blur(0.3px);
      opacity: 0.56;
    }

    .shelf-left {
      left: -2%;
      transform: perspective(700px) rotateY(8deg);
    }

    .shelf-right {
      right: -2%;
      transform: perspective(700px) rotateY(-8deg);
    }

    .shelf::before {
      content: "";
      position: absolute;
      inset: 0;
      background:
        repeating-linear-gradient(
          to right,
          rgba(255, 210, 140, 0.12) 0 18px,
          rgba(42, 70, 112, 0.1) 18px 26px
        );
      mix-blend-mode: screen;
      opacity: 0.5;
    }

    .ai-brain {
      position: absolute;
      right: 7%;
      top: 6%;
      width: 360px;
      height: 220px;
      border-radius: 55% 45% 52% 48% / 56% 44% 58% 42%;
      background:
        radial-gradient(circle at 58% 46%, rgba(146, 224, 255, 0.95) 0 3px, transparent 4px),
        radial-gradient(circle at 36% 55%, rgba(146, 224, 255, 0.72) 0 2px, transparent 3px),
        radial-gradient(circle at 73% 64%, rgba(146, 224, 255, 0.68) 0 2px, transparent 3px),
        repeating-linear-gradient(20deg, rgba(104, 203, 255, 0.3) 0 2px, transparent 2px 14px);
      border: 1px solid rgba(101, 205, 255, 0.5);
      box-shadow:
        0 0 42px rgba(87, 194, 255, 0.42),
        0 0 100px rgba(87, 194, 255, 0.26);
      opacity: 0.72;
      filter: blur(0.2px);
    }

    .chart-panel {
      position: absolute;
      right: 9%;
      top: 34%;
      width: 300px;
      height: 190px;
      border-radius: 14px;
      border: 1px solid rgba(101, 184, 255, 0.44);
      background:
        linear-gradient(180deg, rgba(18, 40, 74, 0.68), rgba(15, 30, 55, 0.62)),
        repeating-linear-gradient(
          to right,
          rgba(114, 174, 236, 0.15) 0 1px,
          transparent 1px 34px
        ),
        repeating-linear-gradient(
          to bottom,
          rgba(114, 174, 236, 0.14) 0 1px,
          transparent 1px 30px
        );
      box-shadow: 0 0 34px rgba(89, 180, 255, 0.2);
      opacity: 0.72;
    }

    .chart-panel::before {
      content: "";
      position: absolute;
      left: 18px;
      right: 18px;
      bottom: 20px;
      height: 94px;
      background:
        linear-gradient(to top, rgba(255, 187, 93, 0.45), rgba(255, 187, 93, 0)),
        linear-gradient(to right, rgba(255, 200, 130, 0.15), rgba(108, 191, 255, 0.28));
      clip-path: polygon(0% 94%, 12% 72%, 22% 76%, 34% 54%, 46% 58%, 57% 34%, 69% 40%, 81% 16%, 100% 6%, 100% 100%, 0% 100%);
    }

    .growth-bars {
      position: absolute;
      right: 6%;
      bottom: 7%;
      width: 250px;
      height: 180px;
      border-radius: 14px;
      border: 1px solid rgba(101, 184, 255, 0.35);
      background:
        linear-gradient(180deg, rgba(13, 31, 60, 0.62), rgba(9, 22, 42, 0.7)),
        repeating-linear-gradient(
          to right,
          rgba(114, 174, 236, 0.12) 0 1px,
          transparent 1px 26px
        );
      box-shadow: 0 0 30px rgba(86, 178, 255, 0.16);
      opacity: 0.68;
    }

    .growth-bars::before {
      content: "";
      position: absolute;
      inset: 20px 18px 20px;
      background:
        repeating-linear-gradient(
          to right,
          rgba(73, 186, 255, 0.68) 0 14px,
          transparent 14px 24px
        );
      clip-path: polygon(0% 100%, 0% 88%, 10% 88%, 10% 72%, 20% 72%, 20% 60%, 30% 60%, 30% 52%, 40% 52%, 40% 38%, 50% 38%, 50% 44%, 60% 44%, 60% 28%, 70% 28%, 70% 22%, 80% 22%, 80% 16%, 90% 16%, 90% 8%, 100% 8%, 100% 100%);
    }

    .robot-arm {
      position: absolute;
      left: -3%;
      bottom: -4%;
      width: 320px;
      height: 270px;
      border-radius: 48% 52% 0 0 / 58% 58% 0 0;
      background:
        linear-gradient(160deg, rgba(234, 164, 84, 0.4), rgba(70, 106, 168, 0.26)),
        radial-gradient(circle at 62% 44%, rgba(98, 191, 255, 0.28), transparent 55%);
      border: 1px solid rgba(156, 205, 255, 0.24);
      filter: blur(0.3px);
      opacity: 0.75;
      transform: rotate(-10deg);
    }

    .center-hud {
      position: absolute;
      left: 50%;
      top: 50%;
      width: 760px;
      height: 460px;
      transform: translate(-50%, -50%);
      border-radius: 26px;
      border: 1px solid rgba(99, 190, 255, 0.1);
      background:
        radial-gradient(460px 220px at 50% 48%, rgba(76, 175, 255, 0.1), transparent 68%),
        repeating-linear-gradient(
          to right,
          rgba(96, 170, 236, 0.07) 0 1px,
          transparent 1px 30px
        ),
        repeating-linear-gradient(
          to bottom,
          rgba(96, 170, 236, 0.06) 0 1px,
          transparent 1px 26px
        );
      box-shadow:
        0 0 60px rgba(76, 175, 255, 0.1),
        inset 0 0 34px rgba(76, 175, 255, 0.06);
      opacity: 0.34;
    }

    .center-hud::before {
      content: "";
      position: absolute;
      left: 40px;
      right: 40px;
      top: 18px;
      height: 1px;
      background: linear-gradient(90deg, transparent, rgba(112, 190, 255, 0.45), transparent);
    }

    .center-hud::after {
      content: "";
      position: absolute;
      left: 40px;
      right: 40px;
      bottom: 18px;
      height: 1px;
      background: linear-gradient(90deg, transparent, rgba(112, 190, 255, 0.45), transparent);
    }

    .center-trend {
      position: absolute;
      left: 50%;
      top: 58%;
      width: 720px;
      height: 220px;
      transform: translate(-50%, -50%);
      background: linear-gradient(
        to top,
        rgba(255, 188, 102, 0.22),
        rgba(255, 188, 102, 0)
      );
      clip-path: polygon(0% 86%, 10% 72%, 22% 76%, 34% 52%, 47% 58%, 58% 35%, 71% 39%, 83% 18%, 100% 6%, 100% 100%, 0% 100%);
      opacity: 0.28;
      filter: drop-shadow(0 0 16px rgba(255, 188, 102, 0.18));
    }

    .center-trend::before {
      content: "";
      position: absolute;
      inset: 0;
      background: linear-gradient(to right, rgba(122, 209, 255, 0.16), rgba(255, 196, 120, 0.3));
      clip-path: polygon(0% 86%, 10% 72%, 22% 76%, 34% 52%, 47% 58%, 58% 35%, 71% 39%, 83% 18%, 100% 6%, 100% 12%, 83% 24%, 71% 45%, 58% 41%, 47% 64%, 34% 58%, 22% 82%, 10% 78%, 0% 92%);
    }

    .center-nodes {
      position: absolute;
      left: 50%;
      top: 50%;
      width: 760px;
      height: 460px;
      transform: translate(-50%, -50%);
      background:
        radial-gradient(circle at 13% 28%, rgba(99, 206, 255, 0.55) 0 3px, transparent 4px),
        radial-gradient(circle at 26% 18%, rgba(99, 206, 255, 0.42) 0 2px, transparent 3px),
        radial-gradient(circle at 74% 20%, rgba(255, 194, 113, 0.5) 0 3px, transparent 4px),
        radial-gradient(circle at 88% 32%, rgba(99, 206, 255, 0.52) 0 3px, transparent 4px),
        radial-gradient(circle at 18% 74%, rgba(255, 194, 113, 0.42) 0 3px, transparent 4px),
        radial-gradient(circle at 82% 78%, rgba(99, 206, 255, 0.5) 0 3px, transparent 4px);
      opacity: 0.24;
    }

    .mesh-bg {
      position: fixed;
      inset: -20%;
      pointer-events: none;
      z-index: 0;
      background:
        radial-gradient(800px 460px at 10% 12%, rgba(59, 130, 246, 0.18), transparent 62%),
        radial-gradient(760px 440px at 88% 18%, rgba(6, 182, 212, 0.14), transparent 64%),
        radial-gradient(680px 420px at 50% 92%, rgba(139, 92, 246, 0.12), transparent 66%);
      filter: blur(14px);
    }

    .login-card {
      position: relative;
      z-index: 4;
      width: min(560px, 100%);
      background:
        linear-gradient(165deg, rgba(20, 33, 58, 0.76), rgba(14, 24, 43, 0.66)),
        radial-gradient(120% 130% at 12% -8%, rgba(103, 198, 255, 0.1), transparent 48%);
      border: 1px solid var(--glass-border);
      border-radius: 24px;
      backdrop-filter: blur(14px);
      box-shadow:
        0 30px 70px rgba(2, 8, 22, 0.56),
        0 0 0 1px rgba(114, 185, 255, 0.08) inset,
        0 0 34px rgba(61, 164, 255, 0.1);
      padding: 30px 30px 24px;
    }

    .login-card::before {
      content: "";
      position: absolute;
      inset: 0;
      border-radius: 24px;
      pointer-events: none;
      background:
        linear-gradient(180deg, rgba(154, 213, 255, 0.1), rgba(154, 213, 255, 0)),
        linear-gradient(110deg, rgba(231, 188, 121, 0.06), transparent 45%);
    }

    .brand {
      display: inline-flex;
      align-items: center;
      gap: 0;
      margin-bottom: 8px;
    }

    .brand-icon {
      width: 58px;
      height: 58px;
      display: block;
      transform: translateY(4px);
    }

    .brand-title {
      margin: 0;
      font-size: 58px;
      line-height: 1;
      font-weight: 800;
      letter-spacing: 0.2px;
      color: #f3f7ff;
    }

    .brand-title .iq {
      display: inline-block;
      background: linear-gradient(90deg, #37d6ff 0%, #7c4dff 100%);
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
      color: transparent;
    }

    .subtitle {
      margin: 8px 0 24px;
      color: var(--muted);
      font-size: 18px;
      font-weight: 600;
      text-shadow: 0 0 18px rgba(88, 165, 255, 0.12);
    }

    .field {
      display: grid;
      gap: 10px;
      margin-bottom: 18px;
    }

    label {
      font-size: 15px;
      font-weight: 700;
      color: var(--muted);
    }

    input {
      width: 100%;
      height: 58px;
      padding: 0 16px;
      border-radius: 16px;
      border: 1px solid rgba(148, 163, 184, 0.4);
      background: rgba(15, 23, 42, 0.7);
      color: #e5e7eb;
      font-size: 19px;
      font-family: inherit;
      box-shadow:
        inset 0 1px 0 rgba(255, 255, 255, 0.08),
        0 0 0 rgba(0, 0, 0, 0);
    }

    input:focus {
      outline: none;
      border-color: rgba(59, 130, 246, 0.82);
      box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.2);
    }

    input::placeholder {
      color: var(--muted);
    }

    .row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      margin-bottom: 18px;
      font-size: 15px;
      color: var(--muted);
    }

    .row a {
      color: #8fb3ff;
      text-decoration: none;
      font-weight: 600;
    }

    .row a:hover { text-decoration: underline; }

    .btn {
      width: 100%;
      height: 58px;
      border: none;
      border-radius: 16px;
      background: linear-gradient(92deg, var(--primary) 0%, var(--secondary) 55%, var(--highlight) 100%);
      color: #fff;
      font-size: 22px;
      font-weight: 700;
      cursor: pointer;
      box-shadow:
        0 14px 30px rgba(59, 130, 246, 0.28),
        0 0 22px rgba(88, 181, 255, 0.22);
      transition: transform 0.2s ease, filter 0.2s ease, box-shadow 0.2s ease;
    }

    .btn:hover {
      filter: brightness(1.05);
      transform: translateY(-1px);
      box-shadow: 0 18px 34px rgba(59, 130, 246, 0.33);
    }

    .sso-btn {
      margin-top: 10px;
      width: 100%;
      height: 54px;
      border-radius: 14px;
      border: 1px solid rgba(148, 163, 184, 0.34);
      background: rgba(15, 23, 42, 0.62);
      color: #e5e7eb;
      font-size: 18px;
      font-weight: 600;
      cursor: pointer;
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.06);
    }

    .note {
      margin-top: 16px;
      font-size: 14px;
      color: var(--muted);
      text-align: center;
    }

    .footer {
      margin-top: 8px;
      font-size: 14px;
      color: var(--muted);
      text-align: center;
    }

    @media (max-width: 760px) {
      .login-card {
        width: min(480px, 100%);
        padding: 28px 24px 24px;
        border-radius: 20px;
      }

      .ai-brain,
      .chart-panel,
      .growth-bars,
      .robot-arm,
      .center-hud,
      .center-trend,
      .center-nodes,
      .scene-grid-sweep,
      .realtime-chart,
      .center-bars {
        display: none;
      }

      .brand-icon {
        width: 50px;
        height: 50px;
      }

      .brand-title {
        font-size: 56px;
      }

      .subtitle {
        font-size: 22px;
      }

      input,
      .btn,
      .sso-btn {
        height: 50px;
        font-size: 16px;
      }
    }
  </style>
</head>
<body>
  <div class="scene" aria-hidden="true">
    <div class="scene-grid-sweep"></div>
    <div class="shelf shelf-left"></div>
    <div class="shelf shelf-right"></div>
    <div class="realtime-chart">
      <svg viewBox="0 0 1200 330" preserveAspectRatio="none">
        <defs>
          <linearGradient id="marketAreaFill" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%" stop-color="rgba(112, 220, 255, 0.3)"></stop>
            <stop offset="100%" stop-color="rgba(112, 220, 255, 0.02)"></stop>
          </linearGradient>
        </defs>
        <path class="chart-area" d="M20,280 L90,262 L160,244 L235,250 L310,214 L386,224 L468,196 L548,202 L630,166 L716,176 L804,134 L892,146 L980,112 L1070,120 L1178,78 L1178,330 L20,330 Z"></path>
        <path class="chart-path" d="M20,280 L90,262 L160,244 L235,250 L310,214 L386,224 L468,196 L548,202 L630,166 L716,176 L804,134 L892,146 L980,112 L1070,120 L1178,78"></path>
        <circle class="chart-dot" cx="1178" cy="78" r="6"></circle>
      </svg>
    </div>
    <div class="center-bars">
      <span style="height:40%"></span><span style="height:52%"></span><span style="height:47%"></span><span style="height:60%"></span><span style="height:56%"></span><span style="height:68%"></span><span style="height:72%"></span><span style="height:66%"></span><span style="height:78%"></span><span style="height:84%"></span><span style="height:90%"></span><span style="height:86%"></span><span style="height:95%"></span><span style="height:100%"></span>
    </div>
    <div class="center-hud"></div>
    <div class="center-trend"></div>
    <div class="center-nodes"></div>
    <div class="ai-brain"></div>
    <div class="chart-panel"></div>
    <div class="growth-bars"></div>
    <div class="robot-arm"></div>
  </div>
  <div class="mesh-bg" aria-hidden="true"></div>
  <main class="login-card">
    <div class="brand">
      <img class="brand-icon" src="/assets/img/demandiq_icon.svg" alt="" aria-hidden="true" />
      <h1 class="brand-title">Demand<span class="iq">IQ</span></h1>
    </div>
    <p class="subtitle">Smart Supply Chain Demand Forecasting</p>

    <form id="loginForm">
      <div class="field">
        <label for="email">Work Email</label>
        <input id="email" type="email" required placeholder="name@company.com" />
      </div>
      <div class="field">
        <label for="password">Password</label>
        <input id="password" type="password" required placeholder="Enter password" />
      </div>
      <div class="row">
        <label><input type="checkbox" id="rememberMe" style="height:auto;width:auto;" /> Remember me</label>
        <a href="#" onclick="event.preventDefault();">Forgot password?</a>
      </div>
      <button class="btn" type="submit">Sign In</button>
      <button class="sso-btn" type="button" onclick="window.location.href='/dashboard'">Sign in with SSO</button>
    </form>

    <p class="note">Authorized users only. Activity is monitored.</p>
    <p class="footer">© 2026 DemandIQ</p>
  </main>

  <script>
    document.getElementById("loginForm").addEventListener("submit", (e) => {
      e.preventDefault();
      window.location.href = "/dashboard";
    });
  </script>
</body>
</html>
